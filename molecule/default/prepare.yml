---
- name: Prepare
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Install python3-docker via apt (Debian)
      ansible.builtin.apt:
        name:
          - "python3-docker"
          - "python3-requests"
        state: present
        update_cache: true
      when:
        - ansible_facts['os_family'] == "Debian"

    - name: Install python3-pip (RedHat)
      ansible.builtin.package:
        name:
          - "python3-pip"
        state: present
      when:
        - ansible_facts['os_family'] == "RedHat"

    # python3-packaging isn't available as an RPM on EL - ansible's pip
    # module needs it importable to compare versions, so it's installed via
    # pip alongside docker.
    - name: Install docker and packaging via pip (RedHat)
      ansible.builtin.pip:
        name:
          - "docker"
          - "packaging"
        state: present
      when:
        - ansible_facts['os_family'] == "RedHat"

    - name: Get python requests version
      ansible.builtin.command: python3 -c "import requests; print(requests.__version__)"
      register: requests_version
      changed_when: false

    - name: Show python requests version
      ansible.builtin.debug:
        msg: "requests version: {{ requests_version.stdout }}"

  roles:
    - role: mullholland.docker
