---
#
# Ansible managed
#

name: Molecule

on:
  push:
    tags_ignore:
      - '*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '1 1 1 * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: ansible-lint
        uses: ansible/ansible-lint@main
  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - image: "ubuntu"
            tag: "resolute"
          - image: "ubuntu"
            tag: "noble"
          - image: "ubuntu"
            tag: "jammy"
          - image: "debian"
            tag: "trixie"
          - image: "fedora"
            tag: "42"
          - image: "fedora"
            tag: "43"
          - image: "rockylinux"
            tag: "8"
          - image: "rockylinux"
            tag: "9"
          - image: "rockylinux"
            tag: "10"
          - image: "almalinux"
            tag: "8"
          - image: "almalinux"
            tag: "9"
          - image: "almalinux"
            tag: "10"
          - image: "centos"
            tag: "9"
          - image: "centos"
            tag: "10"
    env:
      namespace: mullholland
      image: ${{ matrix.config.image }}
      tag: ${{ matrix.config.tag }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: molecule/requirements.txt

      - name: Install Python dependencies
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Run Molecule
        run: molecule test

  # Single check to use as a required status check in branch protection:
  # the "test" job fans out into one context per matrix entry, which is too
  # brittle to list individually (adding/removing a distro would silently
  # break the required check). This job always runs after lint/test finish
  # and fails if either of them did.
  all-tests-passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: always()
    steps:
      - name: Check job results
        run: ${{ !contains(needs.*.result, 'failure') }}
